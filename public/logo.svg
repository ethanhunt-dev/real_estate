<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .blue-dark { fill: #004d80; }
      .blue-med { fill: #2d82b5; }
      .blue-light { fill: #82afce; }
      .green-light { fill: #8cc63f; }
      .green-dark { fill: #6ba327; }
      .text-blue { fill: #004d80; font-family: 'Arial', sans-serif; }
      .text-dev { fill: #2d82b5; font-family: 'Arial', sans-serif; font-size: 24px; letter-spacing: 12px; }
    </style>
  </defs>

  <!-- Buildings -->
  <rect x="260" y="120" width="30" height="100" class="blue-light" />
  <rect x="220" y="90" width="35" height="140" class="blue-med" />
  <rect x="190" y="150" width="25" height="80" class="blue-light" />
  <rect x="295" y="160" width="25" height="60" class="blue-dark" />
  <rect x="225" y="145" width="15" height="30" fill="white" />

  <!-- Roof -->
  <path d="M 160 230 L 240 170 L 340 240" fill="none" stroke="#004d80" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 165 240 L 240 185 L 335 250" fill="none" stroke="#004d80" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Window -->
  <rect x="230" y="210" width="10" height="10" class="blue-med" />
  <rect x="242" y="210" width="10" height="10" class="blue-med" />
  <rect x="230" y="222" width="10" height="10" class="blue-med" />
  <rect x="242" y="222" width="10" height="10" class="blue-med" />

  <!-- Tree -->
  <ellipse cx="150" cy="205" rx="12" ry="25" class="green-light" />
  <rect x="148" y="228" width="4" height="25" class="green-dark" />

  <!-- Fields -->
  <path d="M 130 250 Q 240 220 350 250 L 290 280 L 240 255 L 180 270 Z" class="green-light" />
  <path d="M 180 270 L 240 255 L 260 290 Z" class="green-dark" opacity="0.6" />
  <path d="M 240 255 L 290 280 L 350 250 Z" class="green-light" opacity="0.8" />
  
  <!-- Text -->
  <text x="250" y="340" text-anchor="middle" class="text-blue" font-size="64" font-weight="bold">Vishwa priya</text>
  
  <!-- Developer line -->
  <line x1="80" y1="380" x2="160" y2="380" stroke="#8cc63f" stroke-width="3" />
  <text x="260" y="388" text-anchor="middle" class="text-dev">DEVELOPERS</text>
  <line x1="360" y1="380" x2="440" y2="380" stroke="#8cc63f" stroke-width="3" />

</svg>
